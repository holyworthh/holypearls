services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: holypearls
      POSTGRES_USER: holypearls
      POSTGRES_PASSWORD: holypearls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holypearls"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: holypearls
      MINIO_ROOT_PASSWORD: holypearls-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
  minio_data:
