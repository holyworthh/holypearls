# Weekly update pull requests (TECH-06, review P2-08). Grouped so a week's
# minor and patch updates arrive as one PR per ecosystem; majors come alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node version we run (22, as in CI and the image). Moving to a
      # newer Node is a deliberate decision, not a weekly update.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    ignore:
      # Same Node major as CI and Vercel's build; patch and minor updates still come weekly.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
