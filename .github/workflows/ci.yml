name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: holypearls_ci
          POSTGRES_USER: holypearls_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holypearls_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      API_URL: http://localhost:3001
      API_PORT: 3001
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-${{ github.run_id }}-0123456789abcdef
      DATA_ENCRYPTION_KEY: ci-only-data-key-${{ github.run_id }}-0123456789abcdef
      DATABASE_URL: postgresql://holypearls_ci:${{ github.run_id }}@localhost:5432/holypearls_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency advisories (high and critical fail the build; TECH-06, review P2-08)
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate from an empty database
        run: pnpm db:migrate
      - name: Re-run migrations on the migrated database
        run: pnpm db:migrate
      - name: Check committed migrations match the schema
        run: pnpm --filter @holypearls/db db:check
      - run: pnpm test
      - name: Load seed data
        run: pnpm seed
      - name: Check generated token CSS matches tokens.json
        run: pnpm --filter @holypearls/ui tokens:check
      - name: OpenAPI file matches the contracts
        run: pnpm check:openapi
      - run: docker compose config --quiet
      - run: pnpm build
      - name: The customer site ships no admin (ADR-017)
        run: pnpm --filter @holypearls/web check:no-admin
      - name: Upgrade from the release on main (its schema and seed data, then this branch's migrations)
        # Release reality (review P2-06): production holds main's schema and data, then gets
        # every new migration with the real runner. The result must equal a fresh database.
        env:
          PG: ${{ job.services.postgres.id }}
          UPGRADE_URL: postgresql://holypearls_ci:${{ github.run_id }}@localhost:5432/holypearls_upgrade
          FRESH_URL: postgresql://holypearls_ci:${{ github.run_id }}@localhost:5432/holypearls_fresh
        run: |
          docker exec "$PG" createdb -U holypearls_ci holypearls_upgrade
          docker exec "$PG" createdb -U holypearls_ci holypearls_fresh
          git fetch --no-tags --depth=1 origin main
          git worktree add ../release FETCH_HEAD
          (cd ../release && pnpm install --frozen-lockfile && DATABASE_URL="$UPGRADE_URL" TEST_DATABASE_URL="$UPGRADE_URL" pnpm seed)
          DATABASE_URL="$UPGRADE_URL" node packages/db/dist/migrate-cli.js
          DATABASE_URL="$FRESH_URL" node packages/db/dist/migrate-cli.js
          dump() { docker exec "$PG" pg_dump -U holypearls_ci --schema-only --no-owner "$1" | grep -vE '^(--|\\(un)?restrict )'; }
          diff <(dump holypearls_upgrade) <(dump holypearls_fresh)
          echo "Upgraded schema matches a fresh migration."
      - name: The production image builds and starts (api, worker and migrations)
        env:
          PG_URL: postgresql://holypearls_ci:${{ github.run_id }}@localhost:5432/holypearls_image
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U holypearls_ci holypearls_image
          docker build -t holypearls-api:ci .
          # Whatever happens, show what the container said.
          trap 'docker logs api-image 2>&1 | tail -n 80' EXIT
          docker run -d --name api-image --network host \
            -e DATABASE_URL="$PG_URL" -e API_PORT=3099 -e BETTER_AUTH_URL -e BETTER_AUTH_SECRET -e DATA_ENCRYPTION_KEY \
            holypearls-api:ci sh deploy/start-single.sh
          for attempt in $(seq 1 60); do curl -fsS http://localhost:3099/health/ready && break; sleep 2; done
          curl -fsS http://localhost:3099/health/ready
          # Built code and production dependencies only: no sources, tests or web app.
          docker exec api-image sh -c 'test ! -d /repo/apps/api/src && test ! -d /repo/apps/web/src && test ! -d /repo/apps/web/node_modules'
          docker rm -f api-image
          trap - EXIT
      - name: Install Chromium for browser tests
        run: pnpm --filter @holypearls/web exec playwright install --with-deps chromium
      - name: Accessibility, keyboard and viewport tests (375 and 1440 px)
        run: pnpm --filter @holypearls/web test:e2e
