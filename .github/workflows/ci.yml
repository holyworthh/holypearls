name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:3001
      DATABASE_URL: postgresql://holypearls:holypearls@localhost:5432/holypearls
      API_PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:migrations
      - run: pnpm check:openapi
      - run: docker compose config --quiet
      - run: pnpm build
